<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#100e0d">
  <meta name="description" content="Профиль участника NRG/INDEX: личный тирлист и отзывы.">
  <title>NRG / INDEX — профиль</title>
  <link rel="stylesheet" href="/fonts/fonts.css">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="page-noise" aria-hidden="true"></div>

  <header class="site-header">
    <a class="brand" href="/" aria-label="На главную">
      <span class="brand__name">NRG<span>/</span>INDEX</span>
      <span class="brand__caption">private tasting society</span>
    </a>
    <div class="header-meta">
      <span class="live-dot"></span>
      <a class="header-cab" href="/#rating">рейтинг</a>
      <span class="header-meta__slash">/</span>
      <a class="header-cab" href="cabinet.html">кабинет</a>
    </div>
  </header>

  <main class="profile-page">
    <nav class="profile-people" id="profile-people" aria-label="Участники"></nav>

    <section class="profile-hero" id="profile-hero" aria-live="polite">
      <p class="hint">Загружаю профиль…</p>
    </section>

    <section class="profile-block" id="profile-board-block" hidden>
      <div class="profile-block__head">
        <h2>Личный тирлист</h2>
        <span id="profile-board-meta"></span>
      </div>
      <div class="board-wrap">
        <div class="tier-board" id="profile-board"></div>
      </div>
    </section>

    <section class="profile-block" id="profile-reviews-block" hidden>
      <div class="profile-block__head">
        <h2>Отзывы</h2>
        <span id="profile-reviews-meta"></span>
      </div>
      <div id="profile-reviews"></div>
    </section>

    <section class="profile-block" id="profile-history-block" hidden>
      <div class="profile-block__head">
        <h2>История изменений</h2>
        <span id="profile-history-meta"></span>
      </div>
      <div class="profile-history" id="profile-history"></div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="site-footer__mark">NRG<span>/</span>INDEX</div>
    <p>Частная коллекция сомнительных решений.<br>Обновляется по мере дегустации.</p>
    <p class="site-footer__date"><a class="header-cab" href="/">← на главную</a></p>
  </footer>

  <dialog class="drink-dialog" id="drink-dialog" aria-labelledby="dialog-title">
    <button class="dialog-close" type="button" aria-label="Закрыть">×</button>
    <div id="dialog-content"></div>
  </dialog>

  <script src="countup.js"></script>
  <script src="drink-dialog.js"></script>
  <script src="profile.js"></script>
</body>
</html>
