name: Pipeline

# Публичный репозиторий: все сборки/тесты — на GitHub-hosted.
# Деплой — pull-based агентом на CT111, который проверяет minisign-подпись
# релиза и совпадение коммита с HEAD ветки production.
on:
  push:
    branches: [production]
  pull_request:
    branches: [production]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit, UI and security tests
        run: npm run test:unit && npm run test:ui && npm run test:security

      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: "Smoke: сервер стартует и отвечает"
        run: |
          DB_PATH="$RUNNER_TEMP/nrg-ci.db" UPLOADS_DIR="$RUNNER_TEMP/nrg-ci-uploads" PORT=3210 \
            node server/index.js > /tmp/nrg-ci.log 2>&1 &
          server_pid=$!
          ok=""
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3210/api/health > /dev/null; then ok=1; break; fi
            sleep 0.5
          done
          if [ -z "$ok" ]; then
            echo "Сервер не поднялся:"; cat /tmp/nrg-ci.log; kill "$server_pid" 2>/dev/null || true; exit 1
          fi
          curl -fsS http://127.0.0.1:3210/api/health | grep -q '"ok":true'
          curl -fsS -o /dev/null http://127.0.0.1:3210/
          curl -fsS -o /dev/null http://127.0.0.1:3210/cabinet.html
          kill "$server_pid"

  pre-deploy:
    name: Pre-deploy tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: API and integration tests
        run: npm run test:api

  build:
    name: Build artifact
    needs: [test, pre-deploy]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Package application
        run: |
          set -euo pipefail
          mkdir -p staging/app
          rsync -a \
            --exclude '.git/' --exclude '.github/' --exclude 'tests/' \
            --exclude 'node_modules/' --exclude '.env*' --exclude '*.log' \
            ./ staging/app/
          tar -czf app.tar.gz -C staging app
          ls -lh app.tar.gz

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: nrgindex-app
          path: app.tar.gz
          retention-days: 7

  release:
    name: Release
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/production'
    runs-on: ubuntu-22.04
    environment: production
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: nrgindex-app
          path: .

      - name: Install minisign
        run: sudo apt-get update -qq && sudo apt-get install -y -qq minisign

      - name: Sign artifact
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          set -euo pipefail
          printf '%s' "$MINISIGN_SECRET_KEY" > minisign.key
          chmod 600 minisign.key
          minisign -Sm app.tar.gz -s minisign.key -x app.tar.gz.minisig
          rm -f minisign.key
          ls -lh app.tar.gz app.tar.gz.minisig

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="production-${GITHUB_SHA}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          fi
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --notes "NRGIndex production build from ${GITHUB_SHA}" \
            --latest \
            app.tar.gz app.tar.gz.minisig
